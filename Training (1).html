<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>Junior Training</title>
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#16231c;--mute:#5d6b63;--green:#1f4d3a;--sand:#e3b23c;--line:#d5ddd6}
@media (prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1b261f;--ink:#e8efe9;--mute:#9aa99f;--green:#5fae88;--sand:#e3b23c;--line:#2d3b32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
h2{font-size:1.1rem;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:1.05rem}
.cue{color:var(--mute);font-size:.9rem;margin:2px 0 10px}
.sets{display:flex;gap:10px}
.set{flex:1;min-height:48px;border-radius:10px;border:2px solid var(--green);background:transparent;color:var(--green);font:600 1rem inherit;font-family:inherit}
.set.on{background:var(--green);color:var(--bg)}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pill{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem inherit;font-family:inherit}
.pill.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--green);margin-top:1px;display:grid;place-items:center;font-weight:700;color:var(--bg)}
.row.on .box{background:var(--green)}
.row.on .t{color:var(--mute);text-decoration:line-through}
.t b{display:block}.t span{color:var(--mute);font-size:.88rem}
.btn{display:block;width:100%;min-height:52px;border-radius:12px;border:0;background:var(--sand);color:#2a2000;font:700 1.05rem inherit;font-family:inherit;margin-top:6px}
.btn.done{background:var(--green);color:var(--bg)}
.lvl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.lvl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:1.3rem}
.dots{display:flex;gap:6px;margin:8px 0 4px}
.dot{flex:1;text-align:center;font-size:.75rem;color:var(--mute)}
.dot i{display:block;height:34px;border-radius:8px;border:1px solid var(--line);margin-bottom:3px}
.dot.on i{background:var(--green);border-color:var(--green)}
.big{font-size:2rem;font-weight:700;color:var(--green)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer;min-height:28px}
details ul{margin:8px 0 0;padding-left:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;border:0;background:transparent;color:var(--mute);font:600 .85rem inherit;font-family:inherit}
nav button.on{color:var(--green);box-shadow:inset 0 3px 0 var(--sand)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;padding:12px 0}
.gx{border-bottom:1px solid var(--line)}
.gx:last-child{border-bottom:0}
.gxh{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:8px 0}
.gxh span{color:var(--mute);font-size:.85rem;text-align:right}
.gp{padding:2px 0 14px}
.inp{display:flex;gap:10px;margin-bottom:8px}
.inp label{flex:1;font-size:.85rem;color:var(--mute)}
.inp input{display:block;width:100%;min-height:48px;font-size:1.1rem;margin-top:4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font-family:inherit}
.r2{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;border-top:1px solid var(--line)}
.r2 .link{padding:8px 0}
svg.ch{width:100%;height:auto;margin:4px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
// ---------- Program content (edit the text here to change the program) ----------
var BLOCKS = {
 A:{name:"A Block",ex:[
  {id:"balance",n:"Single Leg Balance",c:"Work up one level at a time until you reach level 10.",bal:1},
  {id:"pallof",n:"Band Resisted Pallof Press",c:"Anti-rotation hold in athletic golf set up posture with core engaged."},
  {id:"slsquat",n:"Single Leg Squat",c:"Control the descent. Slowly down, knee in line with your foot."},
  {id:"bird",n:"Bird Dog",c:"Core engaged, extend opposite arm and leg together. Progression: lift the feet so only hands and knees touch the ground at the start."}]},
 B:{name:"B Block",ex:[
  {id:"hop",n:"Lateral Hop and Stick",c:"Bound sideways, land on one leg and hold the landing for 2 secs. Big leaps, 5-8 hops each side."},
  {id:"latwalk",n:"Banded Lateral Walks",c:"Band above the knee or ankle, athletic hip hinge posture. 12 steps one way, then 12 back."},
  {id:"sldl",n:"Single Leg Deadlift",c:"Bodyweight only. Flat back and stable foot position."},
  {id:"deadbug",n:"Dead Bugs",c:"On your back, arms and legs pointing at the roof. Lower opposite arm and leg with control, all the way down and back up."}]},
 C:{name:"C Block",ex:[
  {id:"ytlw",n:"Y - T - L - W",c:"Face down. Hold each position 1-2 secs across all 4 positions. Repeat 10 times."},
  {id:"row",n:"Band Seated Row",c:"Band looped round your feet, legs straight, sit tall. Squeeze shoulder blades together. Keep arms straight as long as possible."},
  {id:"push",n:"Push Ups",c:"Slow down and go to full depth."},
  {id:"plank",n:"Plank",c:"Core and glutes fully engaged. Hold 45-60 secs.",hold:1},
  {id:"side",n:"Side Planks",c:"Feet, hips and shoulders in line. Hold 45-60 secs each side.",hold:1}]}
};
var BAL = ["Barefoot, eyes open. Hold 30 secs on each leg.",
 "Barefoot, eyes open, golf posture. Hold 30 secs each leg.",
 "Barefoot, eyes open, golf posture. Rotate side to side, chest turning not just arms flapping (arms wide for stability). 30 secs.",
 "Barefoot, standing, eyes closed. Hold 30 secs max or as long as you can.",
 "Barefoot, golf posture rotations. 30 secs each side."];
var RESET = [
 {id:"r1",n:"4 Point Split Thread Through with Lat Stretch"},
 {id:"r2",n:"Dynamic Wind Up - Hips 90/90"},
 {id:"r3",n:"Rotation Control Level 1",c:"Thoracic rotation, arms straight up together, knees together with a foam roller between them. Keep them still as you rotate side to side."},
 {id:"r4",n:"Baby Rocking with Adductor Squeeze",c:"Arms and legs in the air, knees bent at 90 degrees holding a foam roller. Rock side to side, arms and legs in sync. Control through the core."},
 {id:"r5",n:"Groin Bridge Marching",c:"On your back, knees bent, foam roller between knees. March one leg at a time, slow and controlled."},
 {id:"r6",n:"Hip Aeroplanes",c:"Standing, one leg bent with foot against a wall. Rotate around the lead hip."},
 {id:"r7",n:"DK Rotations",c:"One foot elevated behind you, hands on hips. Rotate into the lead hip feeling thighs squeeze together, then rotate to the open side. Control both directions."},
 {id:"r8",n:"Standing Windmill - Same Arm and Leg"},
 {id:"r9",n:"Standing Windmill - Opposite Arm and Leg"}];
var EXTRAS = [
 {id:"e1",n:"Lunge Rotation around Lead Leg"},
 {id:"e2",n:"Single Leg Aeroplanes"},
 {id:"e3",n:"Side Lunge and Rotate"},
 {id:"e4",n:"Standing Windmill (same arm and leg + opposite arm and leg)"}];
var REHAB = {
 "Mobility":["Side Lying 90/90 Peelbacks","Supported Hip Rolling","Split Quadruped Rock Back and Rotate"],
 "Activation":["Baby Rocking","Groin Bridge March","Supine Rotation Control","Lateral Spine Stability"]
};
var GYM = {
 "Upper Body":["Bench Press","Chest Press (Cable)","Seated Row","Cable Pull/Row","Lat Pulldown","Bicep Curl","Tricep Extension","Chest Fly"],
 "Lower Body":["Squat","Single Leg Squat","Deadlift","Single Leg Deadlift","Lunge","Multi Direction Lunge","Step Ups","Step Downs","Calf Raise","Leg Extension","Leg Curl","Glute Bridge","Leg Press"],
 "Core":["Dead Bugs","Bird Dog","Plank","Side Plank","Single Leg Lowers","Single Leg Sliders","Side Lying Leg Raise","Clams","Reverse Clams","Corkscrews","Banded Lateral Walk","Cowboy Walks","Farmers Carry/Walk","Pallof Press","Woodchops","Woodchops H-L","Woodchops L-H"]
};

// ---------- Saved data (stays on this device, in the browser) ----------
var KEY="junior-training-v1", S;
try{ S=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(!S) S={sets:{},mob:{},done:{},level:1,log:{}};
if(!S.log) S.log={};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function ymd(d){ var m=d.getMonth()+1, x=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x; }
var TODAY=ymd(new Date());
var tab="strength", block=null;

function lastBlock(){
  var ks=Object.keys(S.done).sort();
  return ks.length?S.done[ks[ks.length-1]]:null;
}
function nextBlock(){ var l=lastBlock(); return l==="A"?"B":l==="B"?"C":"A"; }
if(!block) block=nextBlock();

function weekDays(){ // Monday to Sunday of this week
  var d=new Date(), off=(d.getDay()+6)%7, out=[];
  d.setDate(d.getDate()-off);
  for(var i=0;i<7;i++){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
  return out;
}
function mobDone(day){
  var n=0; RESET.forEach(function(r){ if(S.mob[day+"|"+r.id]) n++; });
  return n===RESET.length;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

// ---------- Screens ----------
function strengthView(){
  var b=BLOCKS[block], h='<h1>Strength</h1><p class="sub">3 sets of 10 reps. Bodyweight and band only. Up next: '+BLOCKS[nextBlock()].name+'.</p>';
  h+='<div class="pills">'+Object.keys(BLOCKS).map(function(k){return '<button class="pill'+(k===block?' on':'')+'" data-block="'+k+'">'+k+' Block</button>';}).join("")+'</div>';
  b.ex.forEach(function(e){
    h+='<div class="card"><h3>'+esc(e.n)+'</h3>';
    if(e.bal){
      var L=S.level, up=L>5, txt=BAL[(L-1)%5];
      h+='<div class="lvl"><button data-lvl="-1" aria-label="Easier level">-</button><b>Level '+L+' of 10</b><button data-lvl="1" aria-label="Harder level">+</button></div>';
      h+='<p class="cue">'+esc(txt)+(up?' On an uneven surface (cushion). Aim for 30 secs each side.':'')+'</p>';
    } else h+='<p class="cue">'+esc(e.c)+'</p>';
    h+='<div class="sets">';
    for(var i=0;i<3;i++){
      var k=TODAY+"|"+block+"|"+e.id+"|"+i;
      h+='<button class="set'+(S.sets[k]?' on':'')+'" data-set="'+k+'" aria-pressed="'+!!S.sets[k]+'">Set '+(i+1)+'</button>';
    }
    h+='</div></div>';
  });
  var fin=S.done[TODAY]===block;
  h+='<button class="btn'+(fin?' done':'')+'" data-finish="1">'+(fin?'Session logged. Tap to undo':'Finish '+b.name)+'</button>';
  return h;
}
function checklist(items,prefix){
  return '<div class="card">'+items.map(function(r){
    var k=TODAY+"|"+r.id, on=S.mob[k];
    return '<div class="row'+(on?' on':'')+'" data-mob="'+k+'"><div class="box">'+(on?'&#10003;':'')+'</div><div class="t"><b>'+esc(r.n)+'</b>'+(r.c?'<span>'+esc(r.c)+'</span>':'')+'</div></div>';
  }).join("")+'</div>';
}
function resetView(){
  var n=0; RESET.forEach(function(r){ if(S.mob[TODAY+"|"+r.id]) n++; });
  return '<h1>Daily Reset</h1><p class="sub">Do this every day and before any game or practice. '+n+' of '+RESET.length+' done today.</p>'+
    checklist(RESET)+'<h2>Warm up extras</h2>'+checklist(EXTRAS);
}
var openEx=null, openG={};
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(d){ var p=d.split("-"); return parseInt(p[2],10)+" "+MON[parseInt(p[1],10)-1]; }
function att(x){ return esc(x).replace(/"/g,"&quot;"); }
function fe(e){ return (e.sets||1)+" x "+e.reps+" @ "+e.kg+" kg"; }
function lastText(L){
  if(!L.length) return "";
  var d=L[L.length-1].d, t=L.filter(function(e){return e.d===d;}).map(function(e){return fe(e);});
  return t.join(", ");
}
function chart(L){
  var by={}; L.forEach(function(e){ by[e.d]=Math.max(by[e.d]||0,e.kg); });
  var ds=Object.keys(by).sort(); if(ds.length<2) return "";
  var v=ds.map(function(d){return by[d];}), lo=Math.min.apply(null,v), hi=Math.max.apply(null,v); if(hi===lo) hi=lo+1;
  var pts=ds.map(function(d,i){ return [10+i*(280/(ds.length-1)), 85-(by[d]-lo)/(hi-lo)*70]; });
  var svg='<svg class="ch" viewBox="0 0 300 100" role="img" aria-label="Top weight per session"><polyline fill="none" stroke="var(--green)" stroke-width="2.5" points="'+pts.map(function(p){return p[0]+","+p[1];}).join(" ")+'"/>';
  pts.forEach(function(p){ svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--sand)"/>'; });
  return svg+'</svg><p class="cue">Top weight per session: '+fmt(ds[0])+' ('+by[ds[0]]+' kg) to '+fmt(ds[ds.length-1])+' ('+by[ds[ds.length-1]]+' kg)</p>';
}
function panel(n){
  var L=S.log[n]||[], h='<div class="gp"><div class="inp"><label>Weight (kg)<input id="kg" type="number" inputmode="decimal" step="0.5" min="0"></label><label>Reps<input id="reps" type="number" inputmode="numeric" min="1"></label><label>Sets<input id="nsets" type="number" inputmode="numeric" min="1" value="3"></label></div>';
  h+='<button class="btn" data-add="'+att(n)+'">Save entry</button>';
  if(L.length){
    var best=L.reduce(function(a,e){return (e.kg>a.kg||(e.kg===a.kg&&e.reps>a.reps))?e:a;},L[0]);
    h+='<p class="cue">Last session ('+fmt(L[L.length-1].d)+'): '+esc(lastText(L))+'<br>Best: '+fe(best)+'</p>'+chart(L);
    L.slice(-6).reverse().forEach(function(e){
      h+='<div class="r2"><span>'+fmt(e.d)+': '+fe(e)+'</span><button class="link" data-del="'+att(n)+'" data-t="'+e.t+'">Remove</button></div>';
    });
  }
  return h+'</div>';
}
function gymView(){
  var h='<h1>Gym</h1><p class="sub">Tap an exercise to log the weight (kg), reps and sets, and see your progress.</p>';
  Object.keys(GYM).forEach(function(g){
    h+='<details data-g="'+g+'"'+(openG[g]?' open':'')+'><summary>'+g+'</summary>';
    GYM[g].forEach(function(n){
      var L=S.log[n]||[];
      h+='<div class="gx"><button class="gxh" data-ex="'+att(n)+'"><b>'+esc(n)+'</b><span>'+esc(lastText(L))+'</span></button>'+(openEx===n?panel(n):'')+'</div>';
    });
    h+='</details>';
  });
  return h;
}
function rehabView(){
  var h='<h1>Rehab</h1><p class="sub">Tap each exercise to tick it off for today.</p>';
  Object.keys(REHAB).forEach(function(g){
    h+='<h2>'+g+'</h2>'+checklist(REHAB[g].map(function(x,i){ return {id:"rh"+g.charAt(0)+i,n:x}; }));
  });
  return h;
}
function weekView(){
  var days=weekDays(), names=["M","T","W","T","F","S","S"], s=0, m=0;
  days.forEach(function(d){ if(S.done[d]) s++; if(mobDone(d)) m++; });
  var h='<h1>This week</h1><p class="sub">Monday to Sunday.</p>';
  h+='<div class="card"><h3>Strength sessions</h3><div class="big">'+s+' of 3</div><div class="dots">'+days.map(function(d,i){return '<div class="dot'+(S.done[d]?' on':'')+'"><i></i>'+names[i]+'</div>';}).join("")+'</div></div>';
  h+='<div class="card"><h3>Daily reset</h3><div class="big">'+m+' of 7</div><div class="dots">'+days.map(function(d,i){return '<div class="dot'+(mobDone(d)?' on':'')+'"><i></i>'+names[i]+'</div>';}).join("")+'</div></div>';
  h+='<div class="card"><h3>Single leg balance</h3><div class="big">Level '+S.level+'</div><p class="cue">Change your level on the Strength screen.</p></div>';
  h+='<button class="link" data-clear="1">Clear all saved data</button>';
  return h;
}

var TABS=[["strength","Strength"],["reset","Reset"],["gym","Gym"],["rehab","Rehab"],["week","Week"]];
function render(){
  var v=tab==="strength"?strengthView():tab==="reset"?resetView():tab==="gym"?gymView():tab==="rehab"?rehabView():weekView();
  document.getElementById("app").innerHTML=v;
  document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>';}).join("");
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-tab],[data-block],[data-set],[data-mob],[data-lvl],[data-finish],[data-clear],[data-ex],[data-add],[data-del]");
  if(!el) return;
  var y=window.scrollY, d=el.dataset;
  if(d.tab){ tab=d.tab; y=0; }
  else if(d.block){ block=d.block; }
  else if(d.set){ if(S.sets[d.set]) delete S.sets[d.set]; else S.sets[d.set]=1; }
  else if(d.mob){ if(S.mob[d.mob]) delete S.mob[d.mob]; else S.mob[d.mob]=1; }
  else if(d.lvl){ S.level=Math.max(1,Math.min(10,S.level+parseInt(d.lvl,10))); }
  else if(d.finish){ if(S.done[TODAY]===block) delete S.done[TODAY]; else S.done[TODAY]=block; }
  else if(d.ex){ openEx=(openEx===d.ex)?null:d.ex; }
  else if(d.add){
    var kg=parseFloat(document.getElementById("kg").value), reps=parseInt(document.getElementById("reps").value,10), ns=parseInt(document.getElementById("nsets").value,10);
    if(isNaN(kg)||kg<0||isNaN(reps)||reps<1||isNaN(ns)||ns<1){ alert("Enter the weight in kg, the reps and the number of sets."); return; }
    if(!S.log[d.add]) S.log[d.add]=[];
    S.log[d.add].push({d:TODAY,kg:kg,reps:reps,sets:ns,t:Date.now()});
  }
  else if(d.del){ S.log[d.del]=(S.log[d.del]||[]).filter(function(e){return String(e.t)!==d.t;}); }
  else if(d.clear){ if(!confirm("Clear all saved sessions, gym weights and progress on this device?")) return; S={sets:{},mob:{},done:{},level:1,log:{}}; }
  save(); render(); window.scrollTo(0,y);
});
document.addEventListener("toggle",function(e){ var g=e.target.getAttribute&&e.target.getAttribute("data-g"); if(g) openG[g]=e.target.open; },true);
render();
</script>
</body>
</html>
